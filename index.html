<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StriveCCS</title>
<meta name="theme-color" content="#2E3B55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StriveCCS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --pronoun:#FFF176; --verb:#81C784; --descriptor:#64B5F6; --noun:#FFB74D;
    --preposition:#BA68C8; --social:#F48FB1; --negation:#E57373; --misc:#E0E0E0;
    --bg:#F5F6FA; --ink:#222;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);
    -webkit-tap-highlight-color: transparent; overscroll-behavior:none;}
  #app{display:flex;flex-direction:column;height:100vh;}

  #topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#2E3B55;color:#fff;flex-wrap:wrap;}
  #topbar select, #topbar button{font-size:16px;padding:8px 10px;border-radius:8px;border:none;cursor:pointer;}
  #topbar select{background:#fff;color:#222;}
  #topbar button{background:#4C5F82;color:#fff;}
  #topbar button.active{background:#F4B400;color:#222;}
  #topbar .spacer{flex:1;}
  #studentLabel{font-weight:600;font-size:15px;white-space:nowrap;}

  #sentenceBar{display:flex;align-items:center;gap:8px;padding:10px;background:#fff;border-bottom:2px solid #ddd;min-height:64px;}
  #sentenceStrip{flex:1;display:flex;gap:6px;overflow-x:auto;padding:4px;min-height:48px;align-items:center;}
  #sentenceStrip .word{background:#eee;border-radius:8px;padding:8px 12px;font-size:20px;font-weight:600;white-space:nowrap;cursor:pointer;border:2px solid rgba(0,0,0,0.1);}
  #sentenceStrip .placeholder{color:#999;font-size:16px;font-style:italic;}
  #sentenceBar button{font-size:15px;padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;white-space:nowrap;}
  #speakBtn{background:#2E7D32;color:#fff;}
  #clearBtn{background:#C62828;color:#fff;}
  #backspaceBtn{background:#616161;color:#fff;}

  #tabs{display:flex;gap:6px;padding:8px 10px;background:#fff;overflow-x:auto;border-bottom:1px solid #ddd;}
  #tabs button{flex-shrink:0;padding:9px 16px;border-radius:20px;border:2px solid #ccc;background:#fafafa;font-size:15px;font-weight:600;cursor:pointer;color:#333;}
  #tabs button.active{background:#2E3B55;color:#fff;border-color:#2E3B55;}

  #gridWrap{flex:1;overflow-y:auto;padding:10px;}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
  .tile{border-radius:14px;padding:10px 6px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px solid rgba(0,0,0,0.15);box-shadow:0 2px 3px rgba(0,0,0,0.08);user-select:none;position:relative;}
  .tile:active{transform:scale(0.95);}
  .tile .emoji{font-size:32px;line-height:1;}
  .tile .label{font-size:15px;font-weight:700;margin-top:4px;text-align:center;color:#222;}
  .tile.removeMode::after{content:"\2715 ";position:absolute;top:2px;right:6px;color:#C62828;font-weight:900;font-size:16px;}

  #legend{display:flex;flex-wrap:wrap;gap:8px;padding:6px 10px;font-size:12px;background:#fff;border-top:1px solid #eee;}
  #legend span{display:flex;align-items:center;gap:4px;}
  #legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,0.2);}

  #modalOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:50;}
  #modalOverlay.show{display:flex;}
  #modalBox{background:#fff;border-radius:14px;padding:20px;width:min(92vw,460px);max-height:90vh;overflow-y:auto;}
  #modalBox h3{margin-top:0;}
  #modalBox label{display:block;margin:10px 0 4px;font-size:14px;font-weight:600;}
  #modalBox input, #modalBox select{width:100%;padding:9px;font-size:16px;border-radius:8px;border:1px solid #ccc;}
  #modalBox .modalBtns{display:flex;gap:8px;margin-top:16px;}
  #modalBox .modalBtns button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-size:15px;}
  .btnPrimary{background:#2E7D32;color:#fff;}
  .btnSecondary{background:#eee;color:#333;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span id="appTitle" style="font-weight:800;font-size:17px;letter-spacing:0.5px;">StriveCCS</span>
    <span id="studentLabel">Student: &#x2014;</span>
    <select id="studentSelect"></select>
    <button id="newStudentBtn">+ Student</button>
    <div class="spacer"></div>
    <button id="editModeBtn">&#x270E; Edit board</button>
    <button id="removeModeBtn">&#x1F5D1; Remove</button>
    <button id="backupBtn">&#x1F4BE; Backup</button>
  </div>

  <div id="sentenceBar">
    <div id="sentenceStrip"><span class="placeholder">Tap words to build a sentence...</span></div>
    <button id="backspaceBtn">&#x232B;</button>
    <button id="clearBtn">Clear</button>
    <button id="speakBtn">&#x25B6; Speak</button>
  </div>

  <div id="tabs"></div>
  <div id="gridWrap"><div id="grid"></div></div>

  <div id="legend">
    <span><i style="background:var(--social)"></i>Social</span>
    <span><i style="background:var(--pronoun)"></i>Pronouns</span>
    <span><i style="background:var(--verb)"></i>Verbs</span>
    <span><i style="background:var(--descriptor)"></i>Descriptors</span>
    <span><i style="background:var(--noun)"></i>Nouns</span>
    <span><i style="background:var(--preposition)"></i>Prepositions</span>
    <span><i style="background:var(--negation)"></i>Negation</span>
  </div>
</div>

<div id="modalOverlay"><div id="modalBox"></div></div>

<script>
(function(){

const CORE_TABS = {
  "Core": [
    ["I","\u{1F9D1}",'pronoun'], ["you","\u{1FAF5}",'pronoun'], ["want","\u{1F64B}",'verb'], ["like","\u{1F44D}",'verb'],
    ["more","\u{2795}",'verb'], ["go","\u{1F6B6}",'verb'], ["stop","\u{270B}",'negation'], ["all done","\u{2705}",'negation'],
    ["help","\u{1F198}",'verb'], ["look","\u{1F440}",'verb'], ["give","\u{1F932}",'verb'], ["come","\u{1F44B}",'verb'],
    ["yes","\u{2714}\u{FE0F}",'social'], ["no","\u{274C}",'negation'], ["please","\u{1F64F}",'social'], ["thank you","\u{1F64C}",'social']
  ],
  "Feelings": [
    ["happy","\u{1F604}",'descriptor'], ["sad","\u{1F622}",'descriptor'], ["angry","\u{1F620}",'descriptor'],
    ["scared","\u{1F628}",'descriptor'], ["tired","\u{1F634}",'descriptor'], ["hurt","\u{1F915}",'descriptor'],
    ["excited","\u{1F929}",'descriptor'], ["calm","\u{1F60C}",'descriptor'], ["sick","\u{1F912}",'descriptor'],
    ["frustrated","\u{1F624}",'descriptor']
  ],
  "Food & Drink": [
    ["eat","\u{1F37D}\u{FE0F}",'verb'], ["drink","\u{1F964}",'verb'], ["water","\u{1F4A7}",'noun'], ["snack","\u{1F36A}",'noun'],
    ["lunch","\u{1F371}",'noun'], ["fruit","\u{1F34E}",'noun'], ["milk","\u{1F95B}",'noun'], ["hungry","\u{1F354}",'descriptor'],
    ["thirsty","\u{1F964}",'descriptor'], ["finished","\u{1F37D}\u{FE0F}",'negation']
  ],
  "Animals": [
    ["dog","\u{1F436}",'noun'], ["cat","\u{1F431}",'noun'], ["bird","\u{1F426}",'noun'], ["fish","\u{1F41F}",'noun'],
    ["horse","\u{1F434}",'noun'], ["cow","\u{1F42E}",'noun'], ["pig","\u{1F437}",'noun'], ["sheep","\u{1F411}",'noun'],
    ["duck","\u{1F986}",'noun'], ["chicken","\u{1F414}",'noun'], ["rabbit","\u{1F430}",'noun'], ["frog","\u{1F438}",'noun'],
    ["butterfly","\u{1F98B}",'noun'], ["bee","\u{1F41D}",'noun'], ["kangaroo","\u{1F998}",'noun'], ["koala","\u{1F428}",'noun'],
    ["elephant","\u{1F418}",'noun'], ["lion","\u{1F981}",'noun'], ["monkey","\u{1F435}",'noun'], ["turtle","\u{1F422}",'noun']
  ],
  "Actions": [
    ["play","\u{1F9E9}",'verb'], ["open","\u{1F4C2}",'verb'], ["close","\u{1F6AA}",'verb'], ["sit","\u{1FA91}",'verb'],
    ["stand","\u{1F9CD}",'verb'], ["wash","\u{1F9FC}",'verb'], ["read","\u{1F4D6}",'verb'], ["write","\u{270F}\u{FE0F}",'verb'],
    ["listen","\u{1F442}",'verb'], ["wait","\u{23F3}",'verb']
  ],
  "People & Places": [
    ["mom","\u{1F469}",'noun'], ["dad","\u{1F468}",'noun'], ["teacher","\u{1F9D1}\u{200D}\u{1F3EB}",'noun'], ["friend","\u{1F9D1}\u{200D}\u{1F91D}\u{200D}\u{1F9D1}",'noun'],
    ["home","\u{1F3E0}",'noun'], ["school","\u{1F3EB}",'noun'], ["bathroom","\u{1F6BB}",'noun'], ["playground","\u{1F6DD}",'noun'],
    ["classroom","\u{1F3EB}",'noun'], ["outside","\u{1F333}",'preposition']
  ],
   
  "Descriptors": [
    ["big","\u{1F418}",'descriptor'], ["little","\u{1F41C}",'descriptor'], ["hot","\u{1F525}",'descriptor'],
    ["cold","\u{2744}\u{FE0F}",'descriptor'], ["loud","\u{1F50A}",'descriptor'], ["quiet","\u{1F92B}",'descriptor'],
    ["fast","\u{26A1}",'descriptor'], ["slow","\u{1F422}",'descriptor'], ["good","\u{1F44D}",'descriptor'], ["bad","\u{1F44E}",'descriptor']
  ],
  "Prepositions": [
    ["in","\u{1F4E5}",'preposition'], ["out","\u{1F4E4}",'preposition'], ["on","\u{2B06}\u{FE0F}",'preposition'],
    ["off","\u{2B07}\u{FE0F}",'preposition'], ["here","\u{1F4CD}",'preposition'], ["there","\u{1F449}",'preposition'],
    ["up","\u{1F53C}",'preposition'], ["down","\u{1F53D}",'preposition']
  ],
  "Custom": []
};
const POS_COLOR = {
  pronoun:'var(--pronoun)', verb:'var(--verb)', descriptor:'var(--descriptor)',
  noun:'var(--noun)', preposition:'var(--preposition)', social:'var(--social)', negation:'var(--negation)'
};

let currentStudent = null;
let currentTab = "Core";
let customWords = {};
let editMode = false;
let removeMode = false;
let sentence = [];

const el = id => document.getElementById(id);

// ---------- Storage ----------
// Every change is written immediately to localStorage AND mirrored to
// IndexedDB. If the browser/app clears localStorage, data is restored
// from IndexedDB on the next start.
const KEY_STUDENTS = 'aac-students-list';
const KEY_CUSTOM   = 'aac-custom-';
const KEY_LAST     = 'aac-last-view';
const IDB_NAME = 'striveccs-db', IDB_STORE = 'kv';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('no idb')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function idbSet(key, value){
  return idbOpen().then(db=> new Promise((resolve)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> resolve(false);
  })).catch(()=>false);
}
function idbGetAll(){
  return idbOpen().then(db=> new Promise((resolve)=>{
    const out = {};
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).openCursor();
    req.onsuccess = ()=>{
      const c = req.result;
      if(c){ out[c.key] = c.value; c.continue(); } else resolve(out);
    };
    req.onerror = ()=> resolve(out);
  })).catch(()=>({}));
}

function storeSet(key, value){
  let ok = true;
  try{ localStorage.setItem(key, value); }
  catch(e){ ok = false; console.error('localStorage save failed', e); }
  idbSet(key, value); // mirror (also works if localStorage is full or blocked)
  return ok;
}
function storeGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}

// Copy anything missing from IndexedDB back into localStorage
async function restoreFromMirror(){
  const all = await idbGetAll();
  Object.keys(all).forEach(k=>{
    if(storeGet(k) === null){
      try{ localStorage.setItem(k, all[k]); }catch(e){}
    }
  });
}
// Make sure the mirror holds everything currently in localStorage
function mirrorAll(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('aac-') === 0) idbSet(k, localStorage.getItem(k));
    }
  }catch(e){}
}

function loadStudents(){
  try{ return JSON.parse(storeGet(KEY_STUDENTS) || '[]'); }catch(e){ return []; }
}
function saveStudents(list){
  storeSet(KEY_STUDENTS, JSON.stringify(list));
}
function loadCustomWords(studentId){
  try{ return JSON.parse(storeGet(KEY_CUSTOM+studentId) || '{}'); }catch(e){ return {}; }
}
function saveCustomWords(studentId, data){
  if(!studentId) return false;
  const ok = storeSet(KEY_CUSTOM+studentId, JSON.stringify(data));
  if(!ok) console.warn('Saved to backup storage only');
  return ok;
}
function saveLastView(){
  storeSet(KEY_LAST, JSON.stringify({student: currentStudent, tab: currentTab}));
}
function loadLastView(){
  try{ return JSON.parse(storeGet(KEY_LAST) || '{}'); }catch(e){ return {}; }
}

// Save again whenever the app is hidden, closed or switched away from
function flushAll(){
  if(currentStudent) saveCustomWords(currentStudent, customWords);
  saveLastView();
  mirrorAll();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushAll(); });
window.addEventListener('pagehide', flushAll);
window.addEventListener('beforeunload', flushAll);

// ---------- Backup / restore ----------
function openBackupModal(){
  const box = el('modalBox');
  box.innerHTML = `
    <h3>Backup</h3>
    <p style="font-size:13px;color:#555;">Download a file with all students and added words, or restore from one (for example on a new tablet).</p>
    <div class="modalBtns" style="flex-direction:column;">
      <button class="btnPrimary" id="exportBtn">\u{2B07} Download backup</button>
      <button class="btnPrimary" id="importBtn">\u{2B06} Restore from file</button>
      <button class="btnSecondary" id="closeBackup">Close</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  `;
  el('modalOverlay').classList.add('show');
  el('closeBackup').onclick = closeModal;
  el('exportBtn').onclick = ()=>{
    flushAll();
    const data = {};
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('aac-') === 0) data[k] = localStorage.getItem(k);
      }
    }catch(e){}
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'striveccs-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  };
  el('importBtn').onclick = ()=> el('importFile').click();
  el('importFile').onchange = (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const data = JSON.parse(r.result);
        Object.keys(data).forEach(k=>{ if(k.indexOf('aac-') === 0) storeSet(k, data[k]); });
        closeModal();
        populateStudentSelect(loadLastView().student);
        alert('Backup restored.');
      }catch(err){ alert('That file could not be read.'); }
    };
    r.readAsText(f);
  };
}

function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){ console.error('Speech error', e); }
}

function renderTabs(){
  const tabsEl = el('tabs');
  tabsEl.innerHTML = '';
  Object.keys(CORE_TABS).forEach(tab=>{
    const b = document.createElement('button');
    b.textContent = tab;
    if(tab===currentTab) b.classList.add('active');
    b.onclick = ()=>{ currentTab = tab; saveLastView(); renderTabs(); renderGrid(); };
    tabsEl.appendChild(b);
  });
}

function renderGrid(){
  const grid = el('grid');
  grid.innerHTML = '';
  const builtIn = CORE_TABS[currentTab] || [];
  const custom = (customWords[currentTab] || []);
  const words = builtIn.concat(custom.map(w=>[...w, true]));

  words.forEach((w)=>{
    const [label, emoji, pos, isCustom] = w;
    const tile = document.createElement('div');
    tile.className = 'tile' + (removeMode && isCustom ? ' removeMode' : '');
    tile.style.background = POS_COLOR[pos] || 'var(--misc)';
    tile.innerHTML = `<div class="emoji">${emoji}</div><div class="label">${label}</div>`;
    tile.onclick = ()=>{
      if(removeMode && isCustom){
        customWords[currentTab] = customWords[currentTab].filter(cw=>cw[0]!==label);
        saveCustomWords(currentStudent, customWords);
        renderGrid();
        return;
      }
      speak(label);
      sentence.push(label);
      renderSentence();
    };
    grid.appendChild(tile);
  });

  if(editMode){
    const addTile = document.createElement('div');
    addTile.className = 'tile';
    addTile.style.background = '#fff';
    addTile.style.border = '2px dashed #999';
    addTile.innerHTML = `<div class="emoji">\u{2795}</div><div class="label">Add word</div>`;
    addTile.onclick = openAddWordModal;
    grid.appendChild(addTile);
  }
}

function renderSentence(){
  const strip = el('sentenceStrip');
  strip.innerHTML = '';
  if(sentence.length===0){
    strip.innerHTML = '<span class="placeholder">Tap words to build a sentence...</span>';
    return;
  }
  sentence.forEach((word, i)=>{
    const s = document.createElement('span');
    s.className = 'word';
    s.textContent = word;
    s.onclick = ()=>{ sentence.splice(i,1); renderSentence(); };
    strip.appendChild(s);
  });
}

function closeModal(){ el('modalOverlay').classList.remove('show'); }


// ---------- Full emoji set (generated in the browser from Unicode ranges) ----------
let _emojiSets = null;
const FLAG_CODES = 'AC AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET EU FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GT GU GW GY HK HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM UN US UY UZ VA VC VE VG VI VN VU WF WS XK YE YT ZA ZM ZW'.split(' ');
function getEmojiSets(){
  if(_emojiSets) return _emojiSets;
  let isEmoji = ()=>true, isBase = ()=>false;
  try{
    const re1 = new RegExp('\\p{Emoji_Presentation}', 'u');
    const re2 = new RegExp('\\p{Emoji_Modifier_Base}', 'u');
    isEmoji = ch => re1.test(ch);
    const NO_TONE = [0x1F46A,0x1F46B,0x1F46C,0x1F46D,0x1F46F,0x1F91D,0x1F93C];
    isBase = ch => re2.test(ch) && NO_TONE.indexOf(ch.codePointAt(0)) === -1;
  }catch(e){}
  const seen = new Set();
  function build(ranges, extras){
    const out = [];
    ranges.forEach(r=>{
      for(let c=r[0]; c<=r[1]; c++){
        const ch = String.fromCodePoint(c);
        if(!seen.has(c) && isEmoji(ch)){ seen.add(c); out.push({e:ch, base:isBase(ch)}); }
      }
    });
    (extras||[]).forEach(c=>{
      const ch = String.fromCodePoint(c);
      if(!seen.has(c)){ seen.add(c); out.push({e:ch+'\uFE0F', base:isBase(ch)}); }
    });
    return out;
  }
  const sets = {};
  sets.smileys = build([[0x1F600,0x1F644],[0x1F910,0x1F915],[0x1F917,0x1F925],[0x1F927,0x1F92F],[0x1F970,0x1F976],[0x1F978,0x1F978],[0x1F97A,0x1F97A],[0x1F9D0,0x1F9D0]], [0x263A,0x2639]);
  sets.people  = build([[0x1F645,0x1F647],[0x1F64B,0x1F64F],[0x1F466,0x1F487],[0x1F440,0x1F450],[0x1F90C,0x1F90C],[0x1F90F,0x1F90F],[0x1F918,0x1F91F],[0x1F926,0x1F926],[0x1F930,0x1F939],[0x1F9B4,0x1F9B9],[0x1F9CD,0x1F9CF],[0x1F9D1,0x1F9DF],[0x1F9E0,0x1F9E0],[0x1F4AA,0x1F4AA],[0x270A,0x270B],[0x1F6B6,0x1F6B6],[0x1F6C0,0x1F6C0],[0x1F6CC,0x1F6CC]], [0x261D,0x270C,0x270D]);
  sets.food    = build([[0x1F345,0x1F37C],[0x1F37E,0x1F37F],[0x1F32D,0x1F32F],[0x1F950,0x1F96F],[0x1F9C0,0x1F9CB],[0x2615,0x2615]], [0x1F37D]);

  sets.activities = build([[0x1F380,0x1F393],[0x1F3A0,0x1F3CA],[0x1F3CF,0x1F3D3],[0x1F3F8,0x1F3F9],[0x1F93A,0x1F93E],[0x1F945,0x1F94F],[0x1F9E9,0x1F9E9],[0x1F9F8,0x1F9F8],[0x26BD,0x26BE],[0x26F3,0x26F3]], [0x265F]);
  sets.travel  = build([[0x1F680,0x1F6C5],[0x1F6D0,0x1F6D2],[0x1F6D5,0x1F6D7],[0x1F6F4,0x1F6FC],[0x1F3E0,0x1F3F0],[0x1F5FB,0x1F5FF],[0x26EA,0x26EA],[0x26F2,0x26F2],[0x26F5,0x26F5],[0x26FA,0x26FA],[0x26FD,0x26FD],[0x2693,0x2693],[0x1F9ED,0x1F9ED]], [0x2708]);

  sets.symbols = build([[0x1F493,0x1F49F],[0x1F4A2,0x1F4A6],[0x1F4A8,0x1F4AD],[0x1F4AF,0x1F4AF],[0x1F500,0x1F53D],[0x1F7E0,0x1F7EB],[0x1F90D,0x1F90E],[0x1F9E1,0x1F9E1],[0x1F5A4,0x1F5A4],[0x2B50,0x2B50],[0x2705,0x2705],[0x274C,0x274E],[0x2753,0x2755],[0x2757,0x2757],[0x2795,0x2797],[0x27B0,0x27B0],[0x27BF,0x27BF],[0x23E9,0x23EC],[0x267F,0x267F],[0x2B1B,0x2B1C],[0x25FD,0x25FE],[0x1F6AB,0x1F6AB]], [0x2764,0x2714,0x2716,0x2660,0x2663,0x2665,0x2666,0x26A0,0x2B06,0x2B07,0x27A1,0x2B05,0x2195,0x2194]);

  sets.flags.unshift({e:'\u{1F3C1}', base:false}, {e:'\u{1F6A9}', base:false}, {e:'\u{1F3F4}', base:false});
  _emojiSets = sets;
  return sets;
}
const EMOJI_CATS = [
  ['recent','\u{1F552}','Recent'], ['smileys','\u{1F600}','Smileys'], ['people','\u{1F44B}','People'],
  ['nature','\u{1F436}','Animals & nature'], ['food','\u{1F34E}','Food & drink'], ['activities','\u26BD','Activities'],
  ['travel','\u{1F697}','Travel & places'], ['objects','\u{1F4A1}','Objects'], ['symbols','\u2764\uFE0F','Symbols'], ['flags','\u{1F3C1}','Flags']
];
const SKIN_TONES = ['', '\u{1F3FB}', '\u{1F3FC}', '\u{1F3FD}', '\u{1F3FE}', '\u{1F3FF}'];
let emojiTone = 0;
function loadRecentEmoji(){ try{ return JSON.parse(storeGet('aac-recent-emoji') || '[]'); }catch(e){ return []; } }
function pushRecentEmoji(e){
  const list = loadRecentEmoji().filter(x=>x!==e);
  list.unshift(e);
  storeSet('aac-recent-emoji', JSON.stringify(list.slice(0,32)));
}

function openAddWordModal(){
  const box = el('modalBox');
  box.innerHTML = `
    <h3>Add word to "${currentTab}"</h3>
    <label>Word / phrase</label>
    <input id="newWordLabel" type="text" placeholder="e.g. iPad">
    <label>Emoji or short icon text</label>
    <input id="newWordEmoji" type="text" placeholder="Tap an icon below or type one" maxlength="16">
    <div id="emojiCats" style="display:flex;gap:4px;margin:8px 0 4px;overflow-x:auto;padding-bottom:4px;"></div>
    <div id="emojiTones" style="display:flex;align-items:center;gap:4px;margin:2px 0 4px;font-size:12px;color:#555;"></div>
    <div id="emojiPicker" style="display:flex;flex-wrap:wrap;gap:4px;height:230px;overflow-y:auto;margin:4px 0;border:1px solid #ddd;border-radius:8px;padding:6px;align-content:flex-start;"></div>
    <label>Word type (for color coding)</label>
    <select id="newWordPos">
      <option value="noun">Noun (orange)</option>
      <option value="verb">Verb (green)</option>
      <option value="descriptor">Descriptor (blue)</option>
      <option value="pronoun">Pronoun (yellow)</option>
      <option value="preposition">Preposition (purple)</option>
      <option value="social">Social (pink)</option>
      <option value="negation">Negation (red)</option>
    </select>
    <div class="modalBtns">
      <button class="btnSecondary" id="cancelAdd">Cancel</button>
      <button class="btnPrimary" id="confirmAdd">Add</button>
    </div>
  `;
  el('modalOverlay').classList.add('show');
  const picker = el('emojiPicker');
  const catBar = el('emojiCats');
  const toneBar = el('emojiTones');
  let activeCat = loadRecentEmoji().length ? 'recent' : 'smileys';

  function emojiList(cat){
    if(cat === 'recent') return loadRecentEmoji().map(e=>({e:e, base:false, raw:true}));
    return getEmojiSets()[cat] || [];
  }
  function showCat(cat){
    activeCat = cat;
    Array.from(catBar.children).forEach(c=>{
      const on = c.dataset.c === cat;
      c.style.background = on ? '#2E3B55' : '#e8e8e8';
    });
    picker.innerHTML = '';
    picker.scrollTop = 0;
    const frag = document.createDocumentFragment();
    emojiList(cat).forEach(item=>{
      const em = (item.base && emojiTone > 0) ? item.e + SKIN_TONES[emojiTone] : item.e;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = em;
      btn.style.cssText = 'font-size:28px;width:46px;height:46px;border:none;background:#f2f2f2;border-radius:8px;cursor:pointer;';
      btn.onclick = ()=>{ el('newWordEmoji').value = em; pushRecentEmoji(em); };
      frag.appendChild(btn);
    });
    picker.appendChild(frag);
    if(!picker.children.length){
      picker.innerHTML = '<span style="color:#888;font-size:14px;padding:6px;">Nothing here yet. Icons you choose will show up here.</span>';
    }
  }
  EMOJI_CATS.forEach(cat=>{
    const c = document.createElement('button');
    c.type = 'button'; c.textContent = cat[1]; c.title = cat[2]; c.dataset.c = cat[0];
    c.style.cssText = 'flex:0 0 auto;width:40px;height:40px;border:none;border-radius:10px;font-size:22px;cursor:pointer;';
    c.onclick = ()=> showCat(cat[0]);
    catBar.appendChild(c);
  });
  const toneLabel = document.createElement('span'); toneLabel.textContent = 'Skin tone:';
  toneBar.appendChild(toneLabel);
  SKIN_TONES.forEach((t,i)=>{
    const tb = document.createElement('button');
    tb.type = 'button';
    tb.textContent = i === 0 ? '\u{1F44B}' : '\u{1F44B}' + t;
    tb.style.cssText = 'width:34px;height:34px;border:none;border-radius:8px;font-size:18px;cursor:pointer;background:' + (i===emojiTone ? '#F4B400' : '#e8e8e8') + ';';
    tb.onclick = ()=>{
      emojiTone = i;
      Array.from(toneBar.querySelectorAll('button')).forEach((x,k)=>{ x.style.background = k===i ? '#F4B400' : '#e8e8e8'; });
      showCat(activeCat);
    };
    toneBar.appendChild(tb);
  });
  showCat(activeCat);
  el('cancelAdd').onclick = closeModal;
  el('confirmAdd').onclick = ()=>{
    const label = el('newWordLabel').value.trim();
    const emoji = el('newWordEmoji').value.trim() || '\u{1F4AC}';
    const pos = el('newWordPos').value;
    if(!label) return;
    if(!customWords[currentTab]) customWords[currentTab] = [];
    customWords[currentTab].push([label, emoji, pos]);
    saveCustomWords(currentStudent, customWords);
    closeModal();
    renderGrid();
  };
}

function openNewStudentModal(){
  const box = el('modalBox');
  box.innerHTML = `
    <h3>Add a student board</h3>
    <label>Student name</label>
    <input id="newStudentName" type="text" placeholder="e.g. Alex">
    <p style="font-size:12px;color:#666;margin-top:10px;">
      This board is saved on this device only. To use the same custom words on another tablet, add them there separately, or use Export/Import (see the \u{2699} menu in the future if added).
    </p>
    <div class="modalBtns">
      <button class="btnSecondary" id="cancelStudent">Cancel</button>
      <button class="btnPrimary" id="confirmStudent">Add</button>
    </div>
  `;
  el('modalOverlay').classList.add('show');
  el('cancelStudent').onclick = closeModal;
  el('confirmStudent').onclick = ()=>{
    const name = el('newStudentName').value.trim();
    if(!name) return;
    const students = loadStudents();
    if(!students.includes(name)){
      students.push(name);
      saveStudents(students);
    }
    closeModal();
    populateStudentSelect(name);
  };
}
function populateStudentSelect(selectId){
  const students = loadStudents();
  const sel = el('studentSelect');
  sel.innerHTML = '';
  if(students.length===0){
    const opt = document.createElement('option');
    opt.textContent = 'No students yet \u{2014} tap + Student';
    opt.value = '';
    sel.appendChild(opt);
    el('studentLabel').textContent = 'Student: \u{2014}';
    currentStudent = null;
    customWords = {};
    renderGrid();
    return;
  }
  students.forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  const chosen = selectId && students.includes(selectId) ? selectId : students[0];
  sel.value = chosen;
  switchStudent(chosen);
}

function switchStudent(name){
  currentStudent = name;
  el('studentLabel').textContent = 'Student: ' + name;
  customWords = loadCustomWords(name);
  saveLastView();
  sentence = [];
  renderSentence();
  renderGrid();
}

function init(){
  const last = loadLastView();
  if(last.tab && CORE_TABS[last.tab]) currentTab = last.tab;
  renderTabs();
  renderGrid();
  renderSentence();
  populateStudentSelect(last.student);
  el('backupBtn').onclick = openBackupModal;

  el('studentSelect').onchange = e => switchStudent(e.target.value);
  el('newStudentBtn').onclick = openNewStudentModal;
  el('speakBtn').onclick = ()=>{ if(sentence.length) speak(sentence.join(' ')); };
  el('clearBtn').onclick = ()=>{ sentence = []; renderSentence(); };
  el('backspaceBtn').onclick = ()=>{ sentence.pop(); renderSentence(); };
  el('editModeBtn').onclick = ()=>{
    editMode = !editMode; removeMode = false;
    el('editModeBtn').classList.toggle('active', editMode);
    el('removeModeBtn').classList.remove('active');
    renderGrid();
  };
  el('removeModeBtn').onclick = ()=>{
    removeMode = !removeMode; editMode = false;
    el('removeModeBtn').classList.toggle('active', removeMode);
    el('editModeBtn').classList.remove('active');
    renderGrid();
  };
  el('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') closeModal(); };

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').then(r=>r.update()).catch(()=>{});
  }
}
// Ask the browser not to evict saved data
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}
function showFatal(e){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#b00020;color:#fff;padding:10px;font:14px sans-serif;z-index:9999';
  d.textContent = 'StriveCCS error: ' + (e && e.message ? e.message : e);
  document.body.appendChild(d);
}
try{
  if(loadStudents().length === 0) saveStudents(['Default']);
  init();
  mirrorAll();
}catch(e){ console.error(e); showFatal(e); }
// Background restore: only if saved data was wiped, and never blocks the app
Promise.race([restoreFromMirror(), new Promise(r=>setTimeout(r, 3000))]).then(()=>{
  try{
    const students = loadStudents();
    if(students.length && (!currentStudent || (students.length > 1))){
      populateStudentSelect(currentStudent || loadLastView().student);
    } else if(currentStudent){
      customWords = loadCustomWords(currentStudent);
      renderGrid();
    }
  }catch(e){ console.error(e); }
});
})();
</script>
